<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Gato mostrando una billetera vacía" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="recorte"><circle cx="200" cy="200" r="186"/></clipPath>
  </defs>

  <circle cx="200" cy="200" r="190" fill="#fbe9dc" stroke="#c8553d" stroke-width="8"/>

  <g clip-path="url(#recorte)">
    <!-- cuerpo -->
    <ellipse cx="200" cy="335" rx="100" ry="80" fill="#ecd0ac"/>

    <!-- orejas -->
    <polygon points="110,150 125,70 185,120" fill="#f3dcc0"/>
    <polygon points="125,135 133,92 165,120" fill="#f2a7a0"/>
    <polygon points="290,150 275,70 215,120" fill="#f3dcc0"/>
    <polygon points="275,135 267,92 235,120" fill="#f2a7a0"/>

    <!-- cabeza -->
    <ellipse cx="200" cy="170" rx="95" ry="80" fill="#f3dcc0"/>

    <!-- ojos -->
    <circle cx="165" cy="165" r="14" fill="#3a2f2a"/>
    <circle cx="235" cy="165" r="14" fill="#3a2f2a"/>
    <circle cx="170" cy="160" r="4.5" fill="#fff"/>
    <circle cx="240" cy="160" r="4.5" fill="#fff"/>

    <!-- nariz y boca -->
    <polygon points="192,188 208,188 200,200" fill="#e58a8a"/>
    <path d="M200 200 v8 M200 208 q-10 8 -20 2 M200 208 q10 8 20 2"
          stroke="#3a2f2a" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- bigotes -->
    <g stroke="#3a2f2a" stroke-width="2.5" opacity=".55" stroke-linecap="round">
      <line x1="140" y1="195" x2="95" y2="188"/>
      <line x1="140" y1="206" x2="95" y2="210"/>
      <line x1="260" y1="195" x2="305" y2="188"/>
      <line x1="260" y1="206" x2="305" y2="210"/>
    </g>

    <!-- billetera abierta y vacía -->
    <rect x="125" y="262" width="150" height="92" rx="14" fill="#5b3a29"/>
    <rect x="138" y="275" width="124" height="66" rx="8" fill="#2f1c11"/>
    <!-- telaraña en la esquina -->
    <g stroke="#7a6154" stroke-width="1.5" fill="none" stroke-linecap="round">
      <path d="M138 275 L170 275 M138 275 L138 307 M138 275 L160 297"/>
      <path d="M150 275 Q150 287 138 287 M162 275 Q162 299 138 299"/>
    </g>
    <!-- broche -->
    <rect x="250" y="300" width="30" height="16" rx="6" fill="#c8553d"/>

    <!-- patas sosteniendo la billetera -->
    <ellipse cx="122" cy="312" rx="24" ry="22" fill="#f3dcc0" stroke="#c9a97f" stroke-width="3"/>
    <ellipse cx="278" cy="312" rx="24" ry="22" fill="#f3dcc0" stroke="#c9a97f" stroke-width="3"/>
    <g stroke="#c9a97f" stroke-width="2.5" stroke-linecap="round">
      <line x1="114" y1="318" x2="114" y2="326"/>
      <line x1="122" y1="320" x2="122" y2="328"/>
      <line x1="130" y1="318" x2="130" y2="326"/>
      <line x1="270" y1="318" x2="270" y2="326"/>
      <line x1="278" y1="320" x2="278" y2="328"/>
      <line x1="286" y1="318" x2="286" y2="326"/>
    </g>
  </g>
</svg>
